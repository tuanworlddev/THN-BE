spring.application.name=THN-BE

server.port=8080

# MySQL config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/nat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis config
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:password}
spring.data.redis.database=${SPRING_REDIS_DATABASE:0}